appId: com.mindflow.app
productName: MindFlow
copyright: Copyright © 2026 MindFlow

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: MindFlow
  installerIcon: electron/icon.png
  uninstallerIcon: electron/icon.png
  installerHeaderIcon: electron/icon.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutProperties:
    - Name: MindFlow
      Description: Приложение для создания ментальных карт

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: electron/icon.png
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: electron/icon.png
  category: Office

publish:
  provider: generic
  url: ''
